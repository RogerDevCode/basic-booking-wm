[project]
name = "booking-titanium-wm"
version = "0.1.0"
description = "Medical Appointment Booking System"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.10.0",
    "email-validator>=2.2.0",
    "asyncpg>=0.30.0",
    "cryptography>=44.0.0",
    "python-dotenv>=1.0.1",
    "returns>=0.24.0",
    "redis>=7.4.0",
    "typing-extensions>=4.15.0",
    "symspellpy>=6.9.0",
    "google-adk[extensions]>=2.0.0",
    "sqlalchemy>=2.0.25",
    "fastapi>=0.136.1",
    "arq>=0.25.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "hypothesis>=6.0.0",
    "pytest-asyncio>=0.25.0",
    "mypy==1.15.0",
    "ruff>=0.9.0",
    "mcp-codebase-index>=0.7.1",
    "pre-commit>=4.1.0",
    "mcp>=1.3.0",
    "token-savior>=1.0.0",
    "pyright>=1.1.396",
    "rapidfuzz>=3.14.5",
    "jellyfish>=1.2.1",
    "dateparser>=1.4.0",
    "aiosqlite>=0.19.0",
]

[tool.uv]
managed = true

[tool.mypy]
python_version = "3.13"
strict = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
mypy_path = "stubs"
# golang-style: all generics parametrized, no untyped returns, no redundant casts
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
disallow_subclassing_any = true
strict_equality = true
extra_checks = true
exclude = ["^reset_nlu\\.py$", "^fix_nlu\\.py$", "^scripts/", "^patch_auth\\.py$", "^conftest\\.py$", "^tests/conftest\\.py$"]


[[tool.mypy.overrides]]
module = "spellchecker.*"
ignore_missing_imports = true


[tool.ruff]
line-length = 120
target-version = "py313"
exclude = ["migrations/", ".venv/", "stubs/"]

[tool.ruff.lint]
# golang-style: explicit, strict, zero dead code, no Any in annotations
select = ["E", "F", "I", "UP", "ANN", "B", "RUF", "TCH", "SIM", "PERF", "PLE", "PLW"]
ignore = [
    "SIM108",   # ternary-over-if — readability wins over brevity
    "PLW0603",  # global-statement — used in Windmill adapters
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "PERF", "PLE", "SIM117", "RUF001", "RUF003", "E501"]  # PLE: chaos tests need raw control chars; SIM117: nested patch() with blocks are intentional; RUF001/003: homoglyphs for threat scanning tests; E501: long test inputs
"scripts/**" = ["ANN", "T20", "SIM", "PLW", "PERF"]
"stubs/**" = ["ANN401"]               # **kwargs: Any is idiomatic in stub files
"patch_auth.py" = ["ANN", "T20", "E501", "I"]

[tool.pyright]
include = ["f/", "scripts/"]
exclude = ["tests/", "stubs/", ".venv/"]
pythonVersion = "3.13"

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths  = ["tests"]
pythonpath = ["."]
addopts    = "-ra --strict-markers --import-mode=importlib"
asyncio_mode = "strict"
markers = [
    "e2e: tests that require a live database (deselect with '-m not e2e')",
    "integration: tests with real external dependencies",
]
filterwarnings = [
    "ignore::pytest.PytestUnraisableExceptionWarning",
    "ignore::pytest.PytestUnhandledThreadExceptionWarning",
    "ignore::ResourceWarning",
    "ignore::RuntimeWarning",
]
